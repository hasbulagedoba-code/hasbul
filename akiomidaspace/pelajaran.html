<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<title>Bahasan Judul | Perpustakaan Matematika</title>
<meta name="description" content="Halaman bahasan judul Pintu 1 Perpustakaan Matematika. Bahasan lengkap dibuka sesuai permintaan pengunjung.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Nunito','Segoe UI',Tahoma,sans-serif;
    background:#0d1424; color:#e8eef8; min-height:100vh;
    background-image:radial-gradient(rgba(255,255,255,.045) 1px, transparent 1.4px);
    background-size:24px 24px;
    padding:calc(20px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom));
  }
  .isi { max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  .chip {
    display:inline-flex; align-items:center; gap:9px; align-self:flex-start;
    background:#141d33; border:3px solid #2a3757; border-radius:11px;
    padding:7px 12px; box-shadow:0 4px 0 rgba(0,0,0,.35);
  }
  .chip .no {
    width:30px; height:30px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    background:var(--zc,#63c8ff);
    font-family:'Press Start 2P',monospace; font-size:12px; color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.4);
  }
  .chip .teks { display:flex; flex-direction:column; }
  .chip .teks b { font-size:15px; font-weight:900; color:#fff; line-height:1.15; }
  .chip .teks i { font-style:normal; font-size:12.5px; font-weight:800; color:#9fb2d8; }
  .kartu {
    background:#141d33; border:4px solid #2a3757; border-radius:16px;
    box-shadow:0 10px 0 rgba(0,0,0,.4);
    padding:24px 22px;
  }
  h1 {
    font-family:'Press Start 2P',monospace;
    font-size:clamp(16px, 4.6vw, 24px); line-height:1.6; letter-spacing:1px;
    color:var(--zk,#ffd166);
  }
  .teaser {
    margin-top:14px; font-size:17.5px; font-weight:800; color:#eef4ff; line-height:1.6;
  }
  .status {
    margin-top:16px; font-size:14.5px; font-weight:900; line-height:1.5;
    color:#ffd166; background:rgba(255,209,102,.08);
    border:2px solid rgba(255,209,102,.3); border-radius:12px; padding:11px 13px;
  }
  .status b { display:block; font-family:'Press Start 2P',monospace; font-size:11px; letter-spacing:1px; margin-bottom:5px; }
  .papan-iklan { max-width:660px; margin:2px auto; padding:0 12px; text-align:center; }
  .papan-iklan .ad-slot { display:block; }
  .aksi { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .btn {
    font-family:'Press Start 2P',monospace; font-size:12px; letter-spacing:1px;
    border-radius:12px; padding:15px 22px; cursor:pointer;
  }
  .btn.utama { color:#3a2a08; background:#ffd166; border:0; border-bottom:6px solid #c9971c; }
  .btn.utama:active { transform:translateY(3px); border-bottom-width:2px; }
  .btn.kedua { color:#e3ebfa; background:#1a2440; border:3px solid #37476f; border-bottom-width:6px; }
  .btn.kedua:active { transform:translateY(3px); border-bottom-width:2px; }
</style>
</head>
<body>
<div class="isi">
  <div class="chip" id="chip">
    <span class="no" id="chipNo">1</span>
    <span class="teks"><b id="chipNama">Penjuru</b><i id="chipSub">Perpustakaan Matematika</i></span>
  </div>

  <div class="kartu">
    <h1 id="judul">Judul</h1>
    <p class="teaser" id="teaser">Pengantar judul.</p>
    <div class="status">
      <b>BAHASAN SEGERA HADIR</b>
      Bahasan lengkap judul ini dibuka sesuai permintaan &mdash; semakin banyak yang ingin
      memahaminya, semakin cepat dibukakan. Sementara itu, masukkan judul ini ke daftar
      paham-mu: papan yang sama masih menunggu di Kamp Angka.
    </div>
  </div>

  <div class="papan-iklan"><div class="ad-slot"></div></div>

  <div class="aksi">
    <button class="btn kedua" id="btnKamp" type="button">&#8592; KEMBALI KE KAMP</button>
    <button class="btn utama" id="btnLanjut" type="button">JUDUL BERIKUTNYA &#8594;</button>
  </div>
</div>

<script src="js/pintu1-data.js"></script>
<script>
(function () {
  'use strict';
  var id = new URLSearchParams(window.location.search).get('id') || '';
  var t = window.P1.topikById(id);
  if (!t) { window.location.replace('kamp-angka-dunia.html'); return; }
  var kat = window.P1.KATEGORI[t.k - 1];

  document.title = t.judul + ' | Pintu 1 — Perpustakaan Matematika';
  document.getElementById('chipNo').textContent = t.n;
  document.getElementById('chipNama').textContent = kat.nama;
  document.getElementById('chipSub').textContent = kat.sub;
  document.getElementById('chip').style.setProperty('--zc', kat.color);
  document.getElementById('judul').textContent = t.judul;
  document.getElementById('judul').style.setProperty('--zk', kat.color);
  document.getElementById('teaser').textContent = t.teaser;

  document.getElementById('btnKamp').addEventListener('click', function () {
    window.location.href = 'kamp-angka-dunia.html';
  });
  var lanjut = window.P1.topikLain(t.id, 1);
  var btn = document.getElementById('btnLanjut');
  if (lanjut) {
    btn.addEventListener('click', function () {
      window.location.href = 'pelajaran.html?id=' + lanjut.id;
    });
  } else {
    btn.style.display = 'none';
  }
})();
</script>
<script src="../assets/js/ads.js?v=2" defer></script>
</body>
</html>
