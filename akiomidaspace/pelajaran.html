<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<title>Bahasan Judul | Perpustakaan Matematika</title>
<meta name="description" content="Peta cerita judul Pintu 1: jelajahi dunia hidup bersama Akio, ikuti jejak stasiun bercahaya, pahami judul lewat cerita dan sejarah ringan berbahasa anak.">
<meta property="og:title" content="Peta Cerita — Pintu 1">
<meta property="og:description" content="Ikuti jejak stasiun bercahaya bersama Akio: cerita dan sejarah ringan dalam dunia yang hidup.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { --skala:1; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family:'Nunito','Segoe UI',Tahoma,sans-serif;
    background:#0d1424; color:#e8eef8;
    -webkit-tap-highlight-color:transparent;
    user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
    background-image:radial-gradient(rgba(255,255,255,.045) 1px, transparent 1.4px);
    background-size:24px 24px;
  }

  /* ---------- panggung ---------- */
  #panggung {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; padding:calc(12px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom));
  }
  body.kontrol-aktif #panggung {
    justify-content:flex-start;
    padding-top:calc(78px + env(safe-area-inset-top));
    padding-bottom:calc(148px + env(safe-area-inset-bottom));
  }
  #layar {
    display:block; background:#9fdcf5;
    image-rendering:crisp-edges; image-rendering:pixelated;
    border:4px solid #1e2a44; border-radius:10px;
    box-shadow:0 14px 44px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.05);
    touch-action:none; cursor:pointer;
    flex:0 0 auto;
  }

  /* ---------- A- / A+ + tombol KAMP ---------- */
  #akses {
    position:fixed; top:calc(12px + env(safe-area-inset-top)); right:14px; z-index:35;
    display:flex; gap:7px;
  }
  #akses button {
    min-width:46px; height:46px; border-radius:12px;
    background:#1a2440; border:3px solid #37476f; border-bottom-width:5px;
    color:#fff; font-family:'Nunito',sans-serif; font-weight:900;
    font-size:calc(15px * var(--skala)); line-height:1;
    cursor:pointer; box-shadow:0 4px 0 #0a0f1c; padding:0 10px;
    transition:transform .06s ease, box-shadow .06s ease;
  }
  #akses button:active { transform:translateY(3px); border-bottom-width:2px; box-shadow:0 1px 0 #0a0f1c; }
  #akses button:disabled { opacity:.4; cursor:default; }
  #btnKamp { font-size:calc(12px * var(--skala)); letter-spacing:1px; }

  /* ---------- tombol aksi besar (LIHAT CERITA) ---------- */
  #aksiBtn {
    position:fixed; left:50%; bottom:calc(26px + env(safe-area-inset-bottom)); z-index:32;
    transform:translateX(-50%) translateY(14px); opacity:0; pointer-events:none;
    font-family:'Press Start 2P',monospace; font-size:calc(12px * var(--skala));
    color:#3a2a08; background:#ffd166; border:0; border-bottom:6px solid #c9971c;
    border-radius:14px; padding:15px 26px; cursor:pointer; letter-spacing:1px;
    transition:opacity .25s ease, transform .25s ease, border-bottom-width .08s ease;
  }
  #aksiBtn.tampil { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  #aksiBtn:active { transform:translateX(-50%) translateY(4px); border-bottom-width:2px; }
  body.dlg-buka #aksiBtn { display:none; }

  /* ---------- dialog cerita (huruf besar, mata minus) ---------- */
  #dialog {
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    display:flex; justify-content:center;
    padding:0 10px calc(12px + env(safe-area-inset-bottom));
    transform:translateY(115%); transition:transform .3s ease;
    pointer-events:none;
  }
  #dialog.aktif { transform:none; pointer-events:auto; }
  .dlg-kardus {
    width:min(620px,100%);
    background:#141d33; border:4px solid #2a3757; border-radius:16px;
    box-shadow:0 10px 0 rgba(0,0,0,.4);
    padding:15px 16px 13px;
  }
  .dlg-kepala { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  #dlgNama { font-family:'Press Start 2P',monospace; font-size:calc(9px * var(--skala)); letter-spacing:1px; }
  #dlgTitik { font-family:'Press Start 2P',monospace; font-size:calc(8px * var(--skala)); color:#8fa2c8; white-space:nowrap; }
  #dlgJudul {
    margin-top:9px; font-size:calc(20px * var(--skala)); font-weight:900;
    line-height:1.25; color:#fff;
  }
  #dlgTeks {
    margin-top:8px; font-size:calc(16.5px * var(--skala)); font-weight:800;
    color:#eef4ff; line-height:1.55;
    max-height:38vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .dlg-aksi { display:flex; gap:10px; margin-top:13px; justify-content:flex-end; flex-wrap:wrap; }
  .dlg-btn {
    font-family:'Press Start 2P',monospace; font-size:calc(11px * var(--skala));
    border:0; border-radius:11px; padding:13px 20px; cursor:pointer; letter-spacing:1px;
  }
  .dlg-btn.utama {
    color:#3a2a08; background:#ffd166; border-bottom:5px solid #c9971c;
  }
  .dlg-btn.utama:active { transform:translateY(3px); border-bottom-width:2px; }
  .dlg-btn.kedua {
    color:#e3ebfa; background:#1a2440; border:3px solid #37476f; border-bottom-width:5px;
  }
  .dlg-btn.kedua:active { transform:translateY(3px); border-bottom-width:2px; }
  body.coarse.dlg-buka #panggung { padding-bottom:calc(20px + env(safe-area-inset-bottom)); }

  /* ---------- kontrol sentuh ---------- */
  #kontrol {
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    display:none; justify-content:space-between; align-items:flex-end;
    padding:0 18px calc(18px + env(safe-area-inset-bottom));
    pointer-events:none;
  }
  body.coarse #kontrol { display:flex; }
  body.dlg-buka #kontrol { display:none; }
  .tb {
    pointer-events:auto;
    width:84px; height:84px;
    font-family:'Press Start 2P',monospace; font-size:24px; line-height:1;
    color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.4);
    background:#1a2440; border:3px solid #37476f; border-radius:18px;
    box-shadow:0 6px 0 #0a0f1c, inset 0 2px 0 rgba(255,255,255,.08);
    cursor:pointer; touch-action:none;
    transition:transform .06s ease, box-shadow .06s ease, background .06s ease;
  }
  .tb.tahan {
    transform:translateY(5px); box-shadow:0 1px 0 #0a0f1c, inset 0 2px 0 rgba(255,255,255,.08);
    background:#28365c; border-color:#4d6196;
  }

  /* ---------- layar muat (pola sama dengan Dunia Akiomida: iklan dulu, dunia tak langsung muncul) ---------- */
  .muat {
    position:fixed; inset:0; z-index:60;
    display:flex;
    background:rgba(8,12,24,.92);
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:20px 12px;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .4s ease, visibility 0s linear .4s;
  }
  .muat.aktif {
    opacity:1; visibility:visible; pointer-events:auto;
    transition:opacity .4s ease;
  }
  .muat-aura {
    position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(circle at 50% 42%, var(--aura, rgba(99,200,255,.16)), rgba(8,12,24,0) 60%);
  }
  .muat-isi {
    position:relative; text-align:center; width:min(372px, 94vw); margin:auto;
    background:#141d33; border:4px solid #2a3757; border-radius:14px;
    box-shadow:0 10px 0 rgba(0,0,0,.4);
    padding:22px 20px;
  }
  .muat-lompat { position:relative; width:54px; height:72px; margin:0 auto 16px; }
  .muat-bola {
    position:absolute; left:0; right:0; bottom:12px; height:54px; border-radius:50%;
    background:radial-gradient(circle at 34% 28%, #fff3cf, #f6c453 58%, #d98f2b);
    box-shadow:0 0 26px rgba(255,214,120,.45), inset 0 -5px 0 rgba(0,0,0,.14);
    transform-origin:50% 100%;
    animation:muatNaik 1.1s cubic-bezier(.5,.02,.6,1) infinite;
  }
  .muat-bayangan {
    position:absolute; left:7px; right:7px; bottom:0; height:8px; border-radius:4px;
    background:rgba(0,0,0,.4);
    animation:muatBayangan 1.1s cubic-bezier(.5,.02,.6,1) infinite;
  }
  @keyframes muatNaik {
    0%   { transform:translateY(0)     scale(1.14,.80); }
    16%  { transform:translateY(-8px)  scale(.94,1.09); }
    46%  { transform:translateY(-26px) scale(1,1); }
    82%  { transform:translateY(-2px)  scale(.96,1.07); }
    93%  { transform:translateY(0)     scale(1.16,.78); }
    100% { transform:translateY(0)     scale(1.14,.80); }
  }
  @keyframes muatBayangan {
    0%,100% { transform:scaleX(1.08); opacity:.36; }
    46%     { transform:scaleX(.62);  opacity:.15; }
  }
  .muat-judul {
    font-family:'Press Start 2P',monospace;
    font-size:calc(clamp(13px, 3.4vw, 17px) * var(--skala));
    line-height:1.7; letter-spacing:.5px;
    color:#ffd166; max-width:78vw; margin:0 auto;
  }
  .muat-sub { margin-top:9px; font-size:calc(15px * var(--skala)); font-weight:800; color:#aec0e4; }
  .muat-titik { margin-left:2px; }
  .muat-titik span { display:inline-block; animation:muatKedip 1.2s infinite; }
  .muat-titik span:nth-child(2) { animation-delay:.2s; }
  .muat-titik span:nth-child(3) { animation-delay:.4s; }
  @keyframes muatKedip { 0%,60%,100% { opacity:.25; } 30% { opacity:1; } }
  .muat-iklan {
    margin:16px auto 0; width:min(324px, 100%);
    background:rgba(255,255,255,.05);
    border:2px solid #2a3757; border-radius:10px; padding:10px;
  }
  .muat-slot { min-height:250px; }
  .muat-slot:not(:empty) { min-height:0; }
  .muat-slot .ad-slot { margin:0 auto !important; }
  .muat-slot iframe { background:#18213a !important; }
  .muat-garis {
    margin:14px auto 0; width:min(324px, 100%); height:6px; border-radius:3px;
    background:#0e1526; overflow:hidden;
  }
  .muat-garis span {
    display:block; height:100%; width:40%;
    background:linear-gradient(90deg, rgba(255,209,102,0), #ffd166, rgba(255,209,102,0));
    animation:muatGaris 1.4s ease-in-out infinite;
  }
  @keyframes muatGaris { from { transform:translateX(-110%); } to { transform:translateX(300%); } }
  .muat-batal {
    display:block; margin:16px auto 0;
    font-family:'Press Start 2P',monospace; font-size:calc(12px * var(--skala));
    color:#e3ebfa; background:#1a2440; border:3px solid #37476f; border-bottom-width:5px;
    border-radius:10px; padding:13px 24px; cursor:pointer; box-shadow:0 4px 0 #0a0f1c;
  }
  .muat-batal:active { transform:translateY(3px); border-bottom-width:2px; box-shadow:0 1px 0 #0a0f1c; }
  @media (max-height:680px) {
    .muat { padding:12px 10px; }
    .muat-isi { padding:16px 16px 14px; }
    .muat-lompat { width:44px; height:58px; margin-bottom:10px; }
    .muat-bola { height:42px; bottom:12px; }
    .muat-bayangan { left:9px; right:9px; }
    .muat-judul { font-size:calc(clamp(11px, 3vw, 14px) * var(--skala)); }
    .muat-iklan { margin-top:12px; }
    .muat-batal { margin-top:12px; padding:11px 20px; }
  }
  @media (max-height:560px) {
    .muat-lompat { display:none; }
  }
  @media (prefers-reduced-motion:reduce) {
    .muat-bola, .muat-bayangan, .muat-titik span, .muat-garis span { animation:none; }
  }

  /* ---------- intro ---------- */
  .intro {
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center;
    text-align:center; padding:18px;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:#0d1424;
    background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.4px);
    background-size:24px 24px;
    transition:opacity .55s ease;
  }
  .intro.pergi { opacity:0; pointer-events:none; }
  .intro .panel {
    margin:auto;
    background:#141d33; border:4px solid #2a3757; border-radius:16px;
    box-shadow:0 12px 0 rgba(0,0,0,.4);
    padding:32px 24px 28px; width:min(520px,100%);
  }
  .intro .akio-css {
    width:52px; height:52px; margin:0 auto 18px; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #ffe9ad, #f6c453 62%, #d98f2b);
    box-shadow:inset 0 -6px 0 rgba(0,0,0,.14), 0 6px 0 rgba(0,0,0,.3);
    animation:melayang 2.6s ease-in-out infinite;
  }
  @keyframes melayang { 0%,100% { transform:translateY(0) scale(1,1); } 50% { transform:translateY(-10px) scale(.97,1.04); } }
  .intro h1 {
    font-family:'Press Start 2P',monospace;
    font-size:calc(clamp(15px, 4.4vw, 22px) * var(--skala));
    line-height:1.7; letter-spacing:1px; color:#ffd166;
  }
  .intro button {
    margin-top:22px; font-family:'Press Start 2P',monospace;
    font-size:calc(13px * var(--skala));
    color:#3a2a08; background:#ffd166; border:0; border-radius:12px;
    border-bottom:6px solid #c9971c;
    padding:17px 36px; cursor:pointer; letter-spacing:1px;
    transition:transform .08s ease, border-bottom-width .08s ease;
  }
  .intro button:active { transform:translateY(4px); border-bottom-width:2px; }
  @media (max-height:520px) {
    .intro .panel { padding:18px 18px 20px; }
    .intro .akio-css { width:38px; height:38px; margin-bottom:10px; }
    .intro button { margin-top:14px; padding:13px 28px; }
  }
  @media (prefers-reduced-motion:reduce) {
    .intro .akio-css { animation:none; }
  }
</style>
</head>
<body>

<div id="panggung">
  <canvas id="layar" width="480" height="270" aria-label="Peta cerita: dunia pixel berisi jejak stasiun cerita judul"></canvas>
</div>

<div id="akses" aria-label="Pengaturan ukuran tulisan">
  <button id="btnKamp" type="button">&#8592; KAMP</button>
  <button id="btnMin" type="button" aria-label="Perkecil tulisan">A&minus;</button>
  <button id="btnPlus" type="button" aria-label="Perbesar tulisan">A+</button>
</div>

<button id="aksiBtn" type="button">LIHAT CERITA</button>

<div id="dialog" role="dialog" aria-label="Cerita tahap">
  <div class="dlg-kardus">
    <div class="dlg-kepala">
      <span id="dlgNama">PETA CERITA</span>
      <span id="dlgTitik">TAHAP 1/6</span>
    </div>
    <div id="dlgJudul">Judul</div>
    <div id="dlgTeks" aria-live="polite"></div>
    <div class="dlg-aksi">
      <button class="dlg-btn kedua" id="btnTutup" type="button">TUTUP</button>
      <button class="dlg-btn utama" id="btnPergi" type="button">PERGI</button>
    </div>
  </div>
</div>

<div id="kontrol">
  <button class="tb" id="btnKiri" type="button" aria-label="Jalan ke kiri">&#9664;</button>
  <button class="tb" id="btnKanan" type="button" aria-label="Jalan ke kanan">&#9654;</button>
</div>

<div class="muat" id="muat" role="dialog" aria-label="Memuat Peta Cerita">
  <div class="muat-aura" id="muatAura"></div>
  <div class="muat-isi">
    <div class="muat-lompat" aria-hidden="true">
      <span class="muat-bola"></span>
      <span class="muat-bayangan"></span>
    </div>
    <div class="muat-judul" id="muatJudul">Membuka Peta Cerita</div>
    <div class="muat-sub">Memuat Dunia<span class="muat-titik" aria-hidden="true"><span>&middot;</span><span>&middot;</span><span>&middot;</span></span></div>
    <div class="muat-iklan">
      <div class="muat-slot" id="muatSlot"></div>
    </div>
    <div class="muat-garis" aria-hidden="true"><span></span></div>
    <button class="muat-batal" id="muatBatal" type="button">KEMBALI</button>
  </div>
</div>

<div class="intro" id="intro">
  <div class="panel">
    <div class="akio-css" aria-hidden="true"></div>
    <h1 id="introJudul">Judul</h1>
    <button id="btnMasuk" type="button">MULAI PETUALANGAN</button>
  </div>
</div>

<script src="js/pintu1-data.js?v=30"></script>
<script src="js/pintu2-data.js?v=30"></script>
<script src="js/kamp-scene.js?v=30"></script>
<script src="js/cerita-data.js?v=30"></script>
<script src="js/pelajaran-main.js?v=30"></script>
<script src="../assets/js/ads.js?v=2" defer></script>
</body>
</html>
