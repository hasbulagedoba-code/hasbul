<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dunia Akiomida — Dunia Hidup Perpustakaan Matematika</title>
<meta name="description" content="Dunia hidup para bola penggelinding. Temui Pilo si pemandu, lalu masuklah ke pintu Lantai 1 untuk mulai belajar matematika dari dasar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(180deg, #e8f4ff 0%, #f6f1e3 100%);
    color: #1e3a5f;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  .panggung-wrap {
    position: relative;
    width: calc(100% - 16px);
    max-width: 1180px;
    height: min(74vh, 700px);
    min-height: 430px;
    margin-top: 12px;
    border-radius: 26px;
    overflow: hidden;
    border: 1px solid rgba(30,58,95,.10);
    box-shadow: 0 18px 44px rgba(30,58,95,.14);
  }
  #panggung { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .topbar {
    position: absolute; top: 12px; left: 12px; right: 12px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none; z-index: 3;
  }
  .chip {
    background: rgba(255,255,255,.9);
    border: 1px solid rgba(30,58,95,.10);
    color: #1e3a5f;
    font-weight: 800; font-size: 13px;
    padding: 8px 16px; border-radius: 999px;
    box-shadow: 0 4px 12px rgba(30,58,95,.10);
  }
  .chip-title b { color: #f59e0b; }
  a.chip-kembali {
    pointer-events: auto; text-decoration: none;
    background: rgba(30,58,95,.88); color: #fff;
  }
  a.chip-kembali:hover { background: #1e3a5f; }

  .papan-iklan {
    width: calc(100% - 24px);
    max-width: 660px;
    margin: 18px auto 0;
    text-align: center;
  }
  .label-iklan {
    display: inline-block; font-size: 10.5px; font-weight: 800;
    letter-spacing: 2px; text-transform: uppercase;
    color: #9aa6b8; margin-bottom: 2px;
  }
  footer {
    text-align: center; font-size: 13px; color: #8a94a6;
    padding: 10px 16px 26px;
  }
  footer b { color: #2dd4bf; }
</style>
</head>
<body>

  <div class="panggung-wrap" id="panggung-wrap">
    <canvas id="panggung" aria-label="Dunia Akiomida: bola-bola menggelinding dan pemandu bernama Pilo"></canvas>
    <div class="topbar">
      <div class="chip chip-title">Dunia <b>Akiomida</b></div>
      <a class="chip chip-kembali" href="../index.html">Pintu Depan</a>
    </div>
  </div>

  <nav class="sr-only" aria-label="Daftar lantai">
    <ul>
      <li><a href="material/sejarah.html">Lantai 1 Dasar — ruang pertama: Sejarah Matematika</a></li>
      <li>Lantai 2 sampai 6 sedang dibangun</li>
    </ul>
  </nav>

  <div class="papan-iklan">
    <span class="label-iklan">Papan Iklan Dunia</span>
    <div class="ad-slot"></div>
  </div>

  <footer>Dibangun perlahan, ditempuh dengan senyum &mdash; <b>Perpustakaan Matematika</b></footer>

  <script src="../assets/js/ads.js" defer></script>
  <script>
  (function () {
    'use strict';

    var wrap = document.getElementById('panggung-wrap');
    var cvs  = document.getElementById('panggung');
    var ctx  = cvs.getContext('2d');

    var RM    = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var SPEED = RM ? 0.22 : 1;

    var W = 0, H = 0, groundY = 0;

    /* ---------- warna & data dunia ---------- */
    var INK = '#1e3a5f';
    var BALL_COLORS = ['#f4a261','#7fb8f0','#a5d6a7','#f2b5c8','#ffd6a5','#9fd8cf','#c5b3f2','#f6d365'];

    var DOORS = [
      { label:'Dasar', sub:'Lantai 1', color:'#5aa9e6', open:true,  href:'material/sejarah.html' },
      { label:'SMP',   sub:'Lantai 2', color:'#3ec6b5', open:false },
      { label:'SMA',   sub:'Lantai 3', color:'#f4b942', open:false },
      { label:'S1',    sub:'Lantai 4', color:'#f28f8f', open:false },
      { label:'S2',    sub:'Lantai 5', color:'#a68ff2', open:false },
      { label:'PhD',   sub:'Lantai 6', color:'#8f9bb3', open:false }
    ];

    var PESAN_PILO = [
      'Halo, aku Pilo. Pemandu dunia ini. Aku menggelinding keliling sambil menunggu tamu.',
      'Mau belajar dari awal? Pintu Dasar warna biru, di ujung sana.',
      'Di dalam pintu Dasar, ruangan pertamanya: Sejarah Matematika.',
      'Pelankan saja langkahmu. Matematika bukan lomba lari, ini jalan sore.',
      'Kalau tersesat, kembali ke sini ya. Aku tidak ke mana-mana.'
    ];

    var balls = [], clouds = [];
    var guide = { x: 0, y: 0, r: 16, color: '#ffd166' };
    var bubble = { show: null, until: 0, alpha: 0, nextAt: 1600, idx: 0 };

    /* ---------- util ---------- */
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function rand(a, b) { return a + Math.random() * (b - a); }

    function hexRgb(h) {
      return [ parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16) ];
    }
    function shade(h, amt) {
      var c = hexRgb(h);
      for (var i = 0; i < 3; i++) c[i] = clamp(Math.round(c[i] + amt), 0, 255);
      return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
    }
    function rr(x, y, w, h, r) {
      if (typeof r === 'number') r = [r,r,r,r];
      ctx.beginPath();
      if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
      var a = Math.min(r[0], w/2), b2 = Math.min(r[1], w/2);
      ctx.moveTo(x + a, y);
      ctx.arcTo(x + w, y, x + w, y + h, b2);
      ctx.arcTo(x + w, y + h, x, y + h, r[2]);
      ctx.arcTo(x, y + h, x, y, r[3]);
      ctx.arcTo(x, y, x + w, y, a);
      ctx.closePath();
    }

    /* ---------- tata letak ---------- */
    function layout() {
      W = wrap.clientWidth;
      H = wrap.clientHeight;
      var DPR = Math.min(window.devicePixelRatio || 1, 2);
      cvs.width = Math.round(W * DPR);
      cvs.height = Math.round(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

      groundY = H * 0.80;

      var n = DOORS.length;
      var pad = clamp(W * 0.05, 10, 60);
      var cell = (W - pad * 2) / n;
      var bw = clamp(cell * 0.66, 40, 120);
      var bh = clamp(bw * 1.25, 58, 158);
      for (var i = 0; i < n; i++) {
        DOORS[i].cx = pad + cell * (i + 0.5);
        DOORS[i].bw = bw;
        DOORS[i].bh = bh;
        DOORS[i].pulse = DOORS[i].pulse || 0;
      }

      guide.x = clamp(W * 0.5, 70, W - 70);

      var target = W < 520 ? 5 : 8;
      while (balls.length < target) spawnBall();
      balls.length = Math.min(balls.length, target);

      var tc = W < 520 ? 2 : 3;
      while (clouds.length < tc) spawnCloud();
      clouds.length = Math.min(clouds.length, tc);
    }

    function spawnBall() {
      var r = rand(11, 21);
      balls.push({
        x: rand(0, Math.max(W, 320)),
        r: r,
        v: rand(26, 72) * (Math.random() < 0.5 ? -1 : 1) * SPEED,
        c: BALL_COLORS[balls.length % BALL_COLORS.length],
        rot: rand(0, 6.28)
      });
    }
    function spawnCloud() {
      clouds.push({
        x: rand(0, Math.max(W, 320)),
        y: rand(H * 0.08, H * 0.30),
        s: rand(0.7, 1.25),
        v: rand(6, 14) * SPEED
      });
    }

    /* ---------- gambar ---------- */
    function drawSky(t) {
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#d9efff');
      g.addColorStop(0.7, '#fdf4e0');
      g.addColorStop(1, '#f9e9c8');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      var sx = W - 74, sy = 66;
      var halo = ctx.createRadialGradient(sx, sy, 10, sx, sy, 90);
      halo.addColorStop(0, 'rgba(255,214,102,.55)');
      halo.addColorStop(1, 'rgba(255,214,102,0)');
      ctx.fillStyle = halo;
      ctx.fillRect(sx - 95, sy - 95, 190, 190);
      ctx.fillStyle = '#ffd166';
      ctx.beginPath(); ctx.arc(sx, sy, 30, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#ffe9ad';
      ctx.beginPath(); ctx.arc(sx - 8, sy - 8, 18, 0, 6.283); ctx.fill();
    }

    function drawClouds(dt) {
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      for (var i = 0; i < clouds.length; i++) {
        var c = clouds[i];
        c.x += c.v * dt;
        if (c.x > W + 120) c.x = -120;
        var y = c.y, s = c.s;
        ctx.beginPath();
        ctx.ellipse(c.x, y, 42 * s, 16 * s, 0, 0, 6.283);
        ctx.ellipse(c.x - 26 * s, y + 6 * s, 24 * s, 12 * s, 0, 0, 6.283);
        ctx.ellipse(c.x + 28 * s, y + 5 * s, 26 * s, 13 * s, 0, 0, 6.283);
        ctx.fill();
      }
    }

    function drawGround() {
      ctx.fillStyle = '#d5ecc8';
      ctx.beginPath(); ctx.ellipse(W * 0.20, groundY + 46, W * 0.30, 74, 0, 3.141, 0); ctx.fill();
      ctx.fillStyle = '#c8e4bd';
      ctx.beginPath(); ctx.ellipse(W * 0.78, groundY + 66, W * 0.34, 96, 0, 3.141, 0); ctx.fill();

      ctx.fillStyle = '#f0e6c0';
      ctx.fillRect(0, groundY, W, H - groundY);
      ctx.fillStyle = '#f7efd4';
      ctx.fillRect(0, groundY, W, 8);

      var p0 = DOORS[0], p5 = DOORS[DOORS.length - 1];
      ctx.fillStyle = '#e6d3a3';
      rr(p0.cx - p0.bw * 0.9, groundY + 4, (p5.cx - p0.cx) + p0.bw * 1.8, 12, 6);
      ctx.fill();
    }

    function drawDoors(t) {
      var small = W < 480;
      for (var i = 0; i < DOORS.length; i++) {
        var d = DOORS[i];
        var glow = d.open ? (0.5 + 0.5 * Math.sin(t * 2 + i)) : 0;

        ctx.save();
        ctx.translate(d.cx, groundY);
        if (d.open) { ctx.shadowColor = d.color; ctx.shadowBlur = 12 + 10 * glow; }
        ctx.globalAlpha = d.open ? 1 : 0.52;

        rr(-d.bw / 2, -d.bh, d.bw, d.bh, [d.bw / 2, d.bw / 2, 7, 7]);
        ctx.fillStyle = d.color;
        ctx.fill();
        ctx.shadowBlur = 0;

        rr(-d.bw / 2 + 5, -d.bh + 5, d.bw - 10, d.bh - 5, [d.bw / 2 - 5, d.bw / 2 - 5, 5, 5]);
        ctx.fillStyle = 'rgba(0,0,0,.16)';
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,.85)';
        ctx.beginPath();
        ctx.arc(d.bw / 2 - 9, -d.bh * 0.45, 3.2, 0, 6.283);
        ctx.fill();
        ctx.restore();

        /* papan nama */
        var fs1 = small ? 8.5 : 9.5, fs2 = small ? 10.5 : 12.5;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '700 ' + fs1 + 'px Nunito, sans-serif';
        var w1 = ctx.measureText(d.sub).width;
        ctx.font = '800 ' + fs2 + 'px Nunito, sans-serif';
        var w2 = ctx.measureText(d.label).width;
        var sw = Math.max(w1, w2) + 22;
        var sy = groundY - d.bh - 44;

        ctx.fillStyle = 'rgba(255,255,255,.94)';
        rr(d.cx - sw / 2, sy, sw, 32, 9);
        ctx.fill();
        ctx.strokeStyle = 'rgba(30,58,95,.12)';
        ctx.stroke();
        ctx.fillStyle = '#8a94a6';
        ctx.font = '700 ' + fs1 + 'px Nunito, sans-serif';
        ctx.fillText(d.sub, d.cx, sy + 10);
        ctx.fillStyle = INK;
        ctx.font = '800 ' + fs2 + 'px Nunito, sans-serif';
        ctx.fillText(d.label, d.cx, sy + 22.5);

        if (d.open) {
          ctx.fillStyle = 'rgba(255,255,255,.95)';
          var pw = 54, py = sy + 38;
          rr(d.cx - pw / 2, py, pw, 18, 9);
          ctx.fill();
          ctx.fillStyle = '#2dd4bf';
          ctx.font = '800 10px Nunito, sans-serif';
          ctx.fillText('BUKA', d.cx, py + 9.5);
        } else {
          ctx.fillStyle = 'rgba(255,255,255,.9)';
          var qw = 52, qy = -d.bh * 0.42;
          rr(d.cx - qw / 2, qy, qw, 17, 8.5);
          ctx.fill();
          ctx.fillStyle = '#7d8aa0';
          ctx.font = '700 9.5px Nunito, sans-serif';
          ctx.fillText('Segera', d.cx, qy + 9);
        }
      }
    }

    function drawBall(b) {
      var cy = groundY - b.r;
      ctx.fillStyle = 'rgba(30,58,95,.12)';
      ctx.beginPath();
      ctx.ellipse(b.x, groundY + 3, b.r * 0.8, b.r * 0.22, 0, 0, 6.283);
      ctx.fill();

      var g = ctx.createRadialGradient(b.x - b.r * 0.35, cy - b.r * 0.4, b.r * 0.15, b.x, cy, b.r);
      g.addColorStop(0, shade(b.c, 45));
      g.addColorStop(0.55, b.c);
      g.addColorStop(1, shade(b.c, -30));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, cy, b.r, 0, 6.283); ctx.fill();

      ctx.fillStyle = 'rgba(0,0,0,.16)';
      for (var k = 0; k < 3; k++) {
        var a = b.rot + k * 2.094;
        ctx.beginPath();
        ctx.arc(b.x + Math.cos(a) * b.r * 0.55, cy + Math.sin(a) * b.r * 0.55, b.r * 0.17, 0, 6.283);
        ctx.fill();
      }
    }

    function drawGuide(t) {
      var bob = RM ? 0 : Math.abs(Math.sin(t * 2.2)) * 5;
      var cy = groundY - guide.r - bob;

      guide.y = cy;
      var glow = ctx.createRadialGradient(guide.x, cy, 4, guide.x, cy, guide.r * 2.4);
      glow.addColorStop(0, 'rgba(255,209,102,.4)');
      glow.addColorStop(1, 'rgba(255,209,102,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(guide.x - 44, cy - 44, 88, 88);

      ctx.fillStyle = 'rgba(30,58,95,.14)';
      ctx.beginPath();
      ctx.ellipse(guide.x, groundY + 3, guide.r * 0.85, guide.r * 0.22, 0, 0, 6.283);
      ctx.fill();

      var g = ctx.createRadialGradient(guide.x - 6, cy - 6, 3, guide.x, cy, guide.r);
      g.addColorStop(0, '#ffe9ad');
      g.addColorStop(0.6, '#ffd166');
      g.addColorStop(1, '#e9a13b');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(guide.x, cy, guide.r, 0, 6.283); ctx.fill();

      ctx.fillStyle = 'rgba(0,0,0,.15)';
      for (var k = 0; k < 3; k++) {
        var a = t * 1.4 + k * 2.094;
        ctx.beginPath();
        ctx.arc(guide.x + Math.cos(a) * guide.r * 0.55, cy + Math.sin(a) * guide.r * 0.55, guide.r * 0.16, 0, 6.283);
        ctx.fill();
      }

      /* papan penunjuk di samping Pilo */
      var px = guide.x - guide.r - 30;
      ctx.strokeStyle = '#b08968'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(px, groundY); ctx.lineTo(px, groundY - 44); ctx.stroke();
      var dir = DOORS[0].cx < guide.x ? '\u2190' : '\u2192';
      var label = 'Lantai 1 ' + dir;
      ctx.font = '800 10.5px Nunito, sans-serif';
      var tw = ctx.measureText(label).width;
      ctx.fillStyle = '#fff';
      rr(px - tw / 2 - 8, groundY - 58, tw + 16, 19, 8);
      ctx.fill();
      ctx.strokeStyle = 'rgba(30,58,95,.15)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, px, groundY - 48.5);
      ctx.lineCap = 'butt';
    }

    function wrapText(text, maxW) {
      ctx.font = '600 12.5px Nunito, sans-serif';
      var words = text.split(' '), lines = [], line = '';
      for (var i = 0; i < words.length; i++) {
        var test = line ? line + ' ' + words[i] : words[i];
        if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = words[i]; }
        else line = test;
      }
      if (line) lines.push(line);
      return lines;
    }

    function drawBubble(dt, t) {
      if (!bubble.show && t * 1000 >= bubble.nextAt) {
        bubble.show = PESAN_PILO[bubble.idx % PESAN_PILO.length];
        bubble.idx++;
        bubble.until = t * 1000 + 5200;
      }
      var target = bubble.show && t * 1000 < bubble.until ? 1 : 0;
      bubble.alpha += (target - bubble.alpha) * Math.min(1, dt * 6);
      if (bubble.alpha < 0.02) {
        if (bubble.show && t * 1000 >= bubble.until) { bubble.show = null; bubble.nextAt = t * 1000 + 5200; }
        return;
      }

      var lines = wrapText(bubble.show, 200);
      var lw = 0;
      for (var i = 0; i < lines.length; i++)
        lw = Math.max(lw, ctx.measureText(lines[i]).width);
      var bw2 = lw + 26, bh2 = lines.length * 17 + 18;
      var bx = clamp(guide.x - bw2 / 2, 10, W - bw2 - 10);
      var by = guide.y - guide.r - bh2 - 18;

      ctx.save();
      ctx.globalAlpha = bubble.alpha;
      ctx.fillStyle = 'rgba(255,255,255,.96)';
      rr(bx, by, bw2, bh2, 12); ctx.fill();
      ctx.strokeStyle = 'rgba(30,58,95,.14)'; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(guide.x - 7, by + bh2 - 1);
      ctx.lineTo(guide.x + 7, by + bh2 - 1);
      ctx.lineTo(guide.x, by + bh2 + 9);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = INK; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.font = '600 12.5px Nunito, sans-serif';
      for (var j = 0; j < lines.length; j++) ctx.fillText(lines[j], bx + 13, by + 10 + j * 17);
      ctx.restore();
    }

    /* ---------- update & loop ---------- */
    function update(dt) {
      for (var i = 0; i < balls.length; i++) {
        var b = balls[i];
        b.x += b.v * dt;
        b.rot += (b.v * dt) / b.r;
        if (b.v > 0 && b.x > W + b.r + 14) b.x = -b.r - 14;
        if (b.v < 0 && b.x < -b.r - 14) b.x = W + b.r + 14;
      }
      for (var j = 0; j < DOORS.length; j++)
        if (DOORS[j].pulse > 0) DOORS[j].pulse = Math.max(0, DOORS[j].pulse - dt);
    }

    var last = performance.now();
    function loop(now) {
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      var t = now / 1000;

      update(dt);
      drawSky(t);
      drawClouds(dt);
      drawGround();
      drawDoors(t);
      drawGuide(t);
      for (var i = 0; i < balls.length; i++) drawBall(balls[i]);
      drawBubble(dt, t);

      requestAnimationFrame(loop);
    }

    /* ---------- interaksi ---------- */
    function hitDoor(mx, my) {
      for (var i = 0; i < DOORS.length; i++) {
        var d = DOORS[i];
        var x = d.cx - d.bw / 2 - 4, y = groundY - d.bh - 48;
        var w = d.bw + 8, h = d.bh + 48;
        if (mx >= x && mx <= x + w && my >= y && my <= y + h) return d;
      }
      return null;
    }
    function hitGuide(mx, my) {
      var dx = mx - guide.x, dy = my - guide.y;
      return dx * dx + dy * dy <= (guide.r + 10) * (guide.r + 10);
    }

    cvs.addEventListener('click', function (e) {
      var r = cvs.getBoundingClientRect();
      var mx = e.clientX - r.left, my = e.clientY - r.top;
      var d = hitDoor(mx, my);
      if (d && d.open) { window.location.href = d.href; return; }
      if (hitGuide(mx, my) || (d && !d.open)) {
        bubble.show = (d && !d.open)
          ? 'Lantai itu masih dibangun. Pelan-pelan, kita sampai juga kok.'
          : PESAN_PILO[bubble.idx % PESAN_PILO.length];
        bubble.idx++;
        bubble.until = performance.now() + 5200;
        bubble.alpha = 0.05;
      }
    });

    cvs.addEventListener('pointermove', function (e) {
      var r = cvs.getBoundingClientRect();
      var mx = e.clientX - r.left, my = e.clientY - r.top;
      var over = hitGuide(mx, my) || (hitDoor(mx, my) || {}).open;
      cvs.style.cursor = over ? 'pointer' : 'default';
    });

    /* ---------- mulai ---------- */
    var rz;
    window.addEventListener('resize', function () {
      clearTimeout(rz);
      rz = setTimeout(layout, 120);
    });

    layout();
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
