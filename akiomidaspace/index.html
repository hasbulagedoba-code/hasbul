<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dunia Akiomida — Petualangan Matematika Terbuka | Perpustakaan Matematika</title>
<meta name="description" content="Masuki Dunia Akiomida: dunia terbuka penuh warna dengan enam wilayah matematika. Berjalan, temui Akio si pemandu keemasan, dan masuki gerbang Kamp Angka untuk menjelajahi peta materi matematika.">
<meta property="og:title" content="Dunia Akiomida — Petualangan Matematika Terbuka">
<meta property="og:description" content="Enam wilayah, satu petualangan matematika. Gerbang pertama telah terbuka.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family:'Nunito','Segoe UI',Tahoma,sans-serif;
    background:#8ec8ee; color:#1e3a5f;
    -webkit-tap-highlight-color:transparent;
  }
  #panggung { position:fixed; inset:0; display:block; touch-action:none; }

  /* ---------- kartu wilayah (kiri-atas) ---------- */
  .chip-wilayah {
    position:fixed; top:calc(14px + env(safe-area-inset-top)); left:16px; z-index:20;
    pointer-events:none; user-select:none;
    background:rgba(255,255,255,.82); backdrop-filter:blur(6px);
    border:1px solid rgba(30,58,95,.10); border-radius:16px;
    padding:8px 16px 9px; box-shadow:0 6px 18px rgba(30,58,95,.12);
    opacity:0; transform:translateY(-8px); transition:opacity .5s ease, transform .5s ease;
  }
  .chip-wilayah.tampil { opacity:1; transform:none; }
  .chip-wilayah .kecil {
    display:block; font-size:10px; font-weight:800; letter-spacing:2.2px;
    text-transform:uppercase; color:#7c8aa0;
  }
  .chip-wilayah .nama { font-size:17px; font-weight:900; color:#22405f; line-height:1.15; }
  .chip-wilayah .slogan { font-size:11.5px; color:#5a7290; }
  @media (max-width:700px) {
    .chip-wilayah { max-width:62vw; padding:6px 12px 7px; }
    .chip-wilayah .nama { font-size:14.5px; }
    .chip-wilayah .slogan { font-size:10px; }
  }

  /* ---------- petunjuk (kiri-bawah) ---------- */
  .hint {
    position:fixed; left:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:20;
    pointer-events:none; user-select:none;
    font-size:12.5px; font-weight:700; color:#3d5875;
    background:rgba(255,255,255,.75); backdrop-filter:blur(6px);
    border:1px solid rgba(30,58,95,.08); border-radius:999px;
    padding:7px 14px; box-shadow:0 4px 14px rgba(30,58,95,.10);
    opacity:0; transition:opacity .6s ease;
  }
  .hint.tampil { opacity:1; }
  .hint.pudar { opacity:0 !important; }

  /* ---------- tombol jalan (mobile) ---------- */
  .btn-jalan {
    position:fixed; bottom:calc(150px + env(safe-area-inset-bottom)); z-index:25;
    width:62px; height:62px; border-radius:50%;
    border:1px solid rgba(255,255,255,.65);
    background:rgba(255,255,255,.30); backdrop-filter:blur(4px);
    color:#fff; font-size:26px; font-weight:900;
    display:none; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; touch-action:none;
    box-shadow:0 6px 16px rgba(30,58,95,.18);
  }
  .btn-jalan:active { background:rgba(255,255,255,.5); }
  body.perangkat-sentuh .btn-jalan { display:flex; }
  #btnKiri { left:16px; } #btnKanan { right:16px; }
  @media (hover:none) and (pointer:coarse) { .btn-jalan { display:flex; } }
  @media (max-width:700px) {
    .btn-jalan { bottom:calc(288px + env(safe-area-inset-bottom)); width:56px; height:56px; }
    .hint { top:calc(72px + env(safe-area-inset-top)); bottom:auto; max-width:80vw; }
  }

  /* ---------- layar muat gerbang ----------
     Iklan tidak menumpang di dunia. Ia hanya tampil di sini:
     saat portal diklik, layar "menyiapkan bahan ajar" muncul,
     lalu perjalanan diteruskan otomatis. Tanpa hitungan detik. */
  .muat {
    position:fixed; inset:0; z-index:60;
    display:flex; align-items:center; justify-content:center;
    background:rgba(13,24,40,.80);
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .45s ease, visibility 0s linear .45s;
  }
  .muat.aktif {
    opacity:1; visibility:visible; pointer-events:auto;
    transition:opacity .45s ease;
  }
  .muat-aura {
    position:absolute; inset:-20%; pointer-events:none;
    background:radial-gradient(circle at 50% 42%, var(--aura, rgba(99,200,255,.20)), rgba(13,24,40,0) 60%);
  }
  .muat-isi { position:relative; text-align:center; padding:20px; max-width:94vw; }
  .muat-lompat { position:relative; width:54px; height:76px; margin:0 auto 18px; }
  .muat-bola {
    position:absolute; left:0; right:0; bottom:12px; height:54px; border-radius:50%;
    background:radial-gradient(circle at 34% 28%, #fff3cf, #f6c453 58%, #d98f2b);
    box-shadow:0 0 30px rgba(255,214,120,.5);
    transform-origin:50% 100%;
    animation:muatNaik 1.1s cubic-bezier(.5,.02,.6,1) infinite;
  }
  .muat-bayangan {
    position:absolute; left:7px; right:7px; bottom:0; height:9px; border-radius:50%;
    background:rgba(0,0,0,.35); filter:blur(2px);
    animation:muatBayangan 1.1s cubic-bezier(.5,.02,.6,1) infinite;
  }
  @keyframes muatNaik {
    0%   { transform:translateY(0)     scale(1.14,.80); }
    16%  { transform:translateY(-8px)  scale(.94,1.09); }
    46%  { transform:translateY(-28px) scale(1,1); }
    82%  { transform:translateY(-2px)  scale(.96,1.07); }
    93%  { transform:translateY(0)     scale(1.16,.78); }
    100% { transform:translateY(0)     scale(1.14,.80); }
  }
  @keyframes muatBayangan {
    0%,100% { transform:scaleX(1.08); opacity:.36; }
    46%     { transform:scaleX(.62);  opacity:.15; }
  }
  .muat-judul {
    font-size:clamp(22px,5vw,30px); font-weight:900; letter-spacing:.4px;
    color:#fff; text-shadow:0 3px 16px rgba(0,0,0,.45);
  }
  .muat-sub { margin-top:7px; font-size:14px; font-weight:700; color:rgba(255,255,255,.74); }
  .muat-titik { margin-left:2px; }
  .muat-titik span { display:inline-block; animation:muatKedip 1.2s infinite; }
  .muat-titik span:nth-child(2) { animation-delay:.2s; }
  .muat-titik span:nth-child(3) { animation-delay:.4s; }
  @keyframes muatKedip { 0%,60%,100% { opacity:.25; } 30% { opacity:1; } }
  .muat-iklan {
    margin:22px auto 0; width:min(330px,88vw);
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.16);
    border-radius:18px; padding:13px 10px 8px;
    box-shadow:0 18px 44px rgba(0,0,0,.35);
  }
  .muat-label {
    display:block; font-size:9px; font-weight:800; letter-spacing:2.6px;
    text-transform:uppercase; color:rgba(255,255,255,.5); margin-bottom:2px;
  }
  .muat-slot { min-height:250px; }
  .muat-slot:not(:empty) { min-height:0; }
  .muat-garis {
    margin:18px auto 0; width:min(330px,88vw); height:4px; border-radius:99px;
    background:rgba(255,255,255,.14); overflow:hidden;
  }
  .muat-garis span {
    display:block; height:100%; width:40%; border-radius:99px;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.85), rgba(255,255,255,0));
    animation:muatGaris 1.4s ease-in-out infinite;
  }
  @keyframes muatGaris { from { transform:translateX(-110%); } to { transform:translateX(300%); } }
  .muat-batal {
    position:absolute; top:calc(14px + env(safe-area-inset-top)); right:16px;
    font-family:inherit; font-size:12.5px; font-weight:800;
    color:rgba(255,255,255,.66); background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2); border-radius:999px;
    padding:7px 16px; cursor:pointer;
    transition:color .2s ease, background .2s ease;
  }
  .muat-batal:hover { color:#fff; background:rgba(255,255,255,.17); }
  @media (prefers-reduced-motion:reduce) {
    .muat-bola, .muat-bayangan, .muat-titik span, .muat-garis span { animation:none; }
  }

  /* ---------- intro sinematik ---------- */
  .intro {
    position:fixed; inset:0; z-index:40; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:linear-gradient(180deg,#4f93cf 0%,#7db8e8 34%,#bfe0f5 62%,#ffe3ae 100%);
    transition:opacity .9s ease; padding:20px;
  }
  .intro.pergi { opacity:0; pointer-events:none; }
  .intro .matahari {
    width:110px; height:110px; border-radius:50%;
    background:radial-gradient(circle at 38% 35%, #fffbe8, #ffe9a8 60%, #ffd98a);
    box-shadow:0 0 70px 26px rgba(255,224,150,.75);
    margin-bottom:34px; animation:timbul 1.6s cubic-bezier(.22,1.4,.36,1) both;
  }
  @keyframes timbul { from { transform:translateY(46px) scale(.6); opacity:0; } }
  .intro h1 {
    font-size:clamp(34px,8vw,58px); font-weight:900; letter-spacing:6px;
    color:#fff; text-shadow:0 3px 0 rgba(43,84,120,.28), 0 14px 34px rgba(43,84,120,.35);
    animation:naik .9s .25s cubic-bezier(.22,1.2,.36,1) both;
  }
  .intro .bawah {
    margin-top:10px; font-size:clamp(14px,3.4vw,17px); font-weight:700; color:#2c4c6b;
    animation:naik .9s .45s cubic-bezier(.22,1.2,.36,1) both;
  }
  .intro .catatan {
    margin-top:6px; font-size:13px; color:#48688a; font-weight:600;
    animation:naik .9s .6s cubic-bezier(.22,1.2,.36,1) both;
  }
  @keyframes naik { from { transform:translateY(26px); opacity:0; } }
  .intro button {
    margin-top:34px; font-family:inherit; font-size:19px; font-weight:900; letter-spacing:1px;
    color:#2c4c6b; background:rgba(255,255,255,.92);
    border:none; border-radius:999px; padding:15px 54px; cursor:pointer;
    box-shadow:0 12px 30px rgba(43,84,120,.35), inset 0 -3px 0 rgba(43,84,120,.12);
    transition:transform .18s ease, box-shadow .18s ease;
    animation:naik .9s .75s cubic-bezier(.22,1.2,.36,1) both;
  }
  .intro button:hover { transform:translateY(-3px) scale(1.03); box-shadow:0 16px 36px rgba(43,84,120,.42), inset 0 -3px 0 rgba(43,84,120,.12); }
  .intro .akio-css {
    position:absolute; bottom:12vh; left:50%; transform:translateX(-50%);
    width:52px; height:52px; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #ffe9ad, #f6c453 62%, #d98f2b);
    box-shadow:0 10px 24px rgba(160,110,20,.35);
    animation:melayang 3.2s ease-in-out infinite;
    opacity:.9;
  }
  @keyframes melayang { 0%,100% { transform:translate(-50%,0) scale(1,1); } 50% { transform:translate(-50%,-16px) scale(.96,1.05); } }
  @media (prefers-reduced-motion:reduce) {
    .intro .matahari, .intro h1, .intro .bawah, .intro .catatan, .intro button, .intro .akio-css { animation:none; }
  }


</style>
</head>
<body>

<canvas id="panggung" aria-label="Dunia Akiomida, dunia terbuka dengan enam wilayah matematika"></canvas>

<div class="chip-wilayah" id="chipWilayah" aria-live="polite">
  <span class="kecil">Wilayah</span>
  <span class="nama" id="chipNama">Kamp Angka</span>
  <span class="slogan" id="chipSlogan">Wilayah permulaan perjalanan</span>
</div>

<div class="hint tampil" id="hint">Klik tanah untuk berjalan &nbsp;·&nbsp; kamera mengikuti dengan sendirinya</div>

<div class="btn-jalan" id="btnKiri" aria-hidden="true">‹</div>
<div class="btn-jalan" id="btnKanan" aria-hidden="true">›</div>

<div class="muat" id="muat" role="dialog" aria-hidden="true" aria-label="Menyiapkan bahan ajar">
  <div class="muat-aura" id="muatAura"></div>
  <div class="muat-isi">
    <div class="muat-lompat" aria-hidden="true">
      <span class="muat-bola"></span>
      <span class="muat-bayangan"></span>
    </div>
    <div class="muat-judul" id="muatJudul">Membuka wilayah</div>
    <div class="muat-sub">Menyiapkan bahan ajar<span class="muat-titik" aria-hidden="true"><span>&middot;</span><span>&middot;</span><span>&middot;</span></span></div>
    <div class="muat-iklan">
      <span class="muat-label">Iklan</span>
      <div class="muat-slot" id="muatSlot"></div>
    </div>
    <div class="muat-garis" aria-hidden="true"><span></span></div>
  </div>
  <button class="muat-batal" id="muatBatal" type="button">Kembali</button>
</div>

<div class="intro" id="intro">
  <div class="matahari"></div>
  <h1>DUNIA AKIOMIDA</h1>
  <div class="bawah">Enam wilayah. Satu petualangan matematika.</div>
  <div class="catatan">Gerbang pertama telah terbuka. Akio sudah menunggu di depannya.</div>
  <button id="btnMasuk" type="button">Masuk Dunia</button>
  <div class="akio-css"></div>
</div>

<script src="js/world-env.js"></script>
<script src="js/world-jelly.js"></script>
<script src="js/world-main.js"></script>
<script src="../assets/js/ads.js" defer></script>
</body>
</html>
