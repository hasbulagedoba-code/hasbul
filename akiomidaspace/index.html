<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<title>Dunia Akiomida — Petualangan Matematika Pixel | Perpustakaan Matematika</title>
<meta name="description" content="Dunia Akiomida versi pixel art: satu layar penuh, semua wilayah terlihat jelas. Tulisan besar ramah mata minus, karakter bulat tanpa wajah. Gerakkan Akio si bulatan emas ke pintu wilayah tujuan. Ramah mobile.">
<meta property="og:title" content="Dunia Akiomida — Petualangan Matematika Pixel">
<meta property="og:description" content="Enam wilayah dalam satu layar. Gerakkan Akio ke pintu tujuan. Tulisan besar, ramah mata minus.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { --skala:1; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family:'Nunito','Segoe UI',Tahoma,sans-serif;
    background:#0d1424; color:#e8eef8;
    -webkit-tap-highlight-color:transparent;
    user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
    background-image:radial-gradient(rgba(255,255,255,.045) 1px, transparent 1.4px);
    background-size:24px 24px;
  }

  /* ---------- panggung (kabinet game) ---------- */
  #panggung {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px;
    padding:calc(12px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom));
    transition:padding .3s ease;
  }
  body.kontrol-aktif #panggung {
    justify-content:flex-start;
    padding-top:calc(78px + env(safe-area-inset-top));
    padding-bottom:calc(148px + env(safe-area-inset-bottom));
  }
  #layar {
    display:block; background:#8fd3f0;
    image-rendering:crisp-edges; image-rendering:pixelated;
    border:4px solid #1e2a44; border-radius:10px;
    box-shadow:0 14px 44px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.05);
    touch-action:none; cursor:pointer;
    flex:0 0 auto;
  }

  /* ---------- chip wilayah (kiri-atas) ---------- */
  .chip-wilayah {
    position:fixed; top:calc(12px + env(safe-area-inset-top)); left:14px; z-index:25;
    pointer-events:none;
    background:#141d33; border:3px solid #2a3757; border-radius:12px;
    padding:9px 13px 10px; box-shadow:0 5px 0 rgba(0,0,0,.35);
    max-width:min(60vw,330px);
    opacity:0; transform:translateY(-8px); transition:opacity .4s ease, transform .4s ease;
  }
  .chip-wilayah.tampil { opacity:1; transform:none; }
  .chip-wilayah .kecil {
    display:block; font-family:'Press Start 2P',monospace;
    font-size:calc(9px * var(--skala));
    letter-spacing:1px; color:#8fa2c8; margin-bottom:5px;
  }
  .chip-wilayah .nama { display:block; font-size:calc(18px * var(--skala)); font-weight:900; color:#fff; line-height:1.12; }
  .chip-wilayah .slogan { display:block; font-size:calc(13.5px * var(--skala)); font-weight:800; color:#aec0e4; margin-top:3px; }
  /* di mobile: chip ramping agar tidak menutupi kanvas */
  body.coarse .chip-wilayah { padding:7px 11px 8px; }
  body.coarse .chip-wilayah .slogan { display:none; }
  body.coarse .chip-wilayah .nama { font-size:calc(16px * var(--skala)); }

  /* ---------- pengaturan tulisan (mata minus): A- / A+ ---------- */
  #akses {
    position:fixed; top:calc(12px + env(safe-area-inset-top)); right:14px; z-index:35;
    display:flex; gap:7px;
  }
  #akses button {
    width:46px; height:46px; border-radius:12px;
    background:#1a2440; border:3px solid #37476f; border-bottom-width:5px;
    color:#fff; font-family:'Nunito',sans-serif; font-weight:900;
    font-size:calc(16px * var(--skala)); line-height:1;
    cursor:pointer; box-shadow:0 4px 0 #0a0f1c;
    transition:transform .06s ease, box-shadow .06s ease;
  }
  #akses button:active { transform:translateY(3px); border-bottom-width:2px; box-shadow:0 1px 0 #0a0f1c; }
  #akses button:disabled { opacity:.4; cursor:default; }

  /* ---------- tombol daftar wilayah (panel melayang) ---------- */
  #btnLegenda {
    position:fixed; top:calc(70px + env(safe-area-inset-top)); right:14px; z-index:35;
    font-family:'Press Start 2P',monospace; font-size:calc(9px * var(--skala));
    color:#e3ebfa; background:#1a2440; border:3px solid #37476f; border-bottom-width:5px;
    border-radius:11px; padding:12px 13px; cursor:pointer; box-shadow:0 4px 0 #0a0f1c;
    letter-spacing:1px; transition:transform .06s ease, box-shadow .06s ease;
  }
  #btnLegenda.tahan { transform:translateY(3px); border-bottom-width:2px; box-shadow:0 1px 0 #0a0f1c; background:#28365c; }
  @media (orientation:portrait) { body.coarse #btnLegenda { display:none; } }

  /* ---------- DAFTAR WILAYAH: huruf besar, ramah mata minus ---------- */
  #legenda {
    display:flex; flex-direction:column; gap:7px;
    background:#141d33; border:3px solid #2a3757; border-radius:14px;
    box-shadow:0 8px 0 rgba(0,0,0,.35);
    padding:12px 12px 11px;
    width:min(330px, 86vw);
    max-height:calc(100vh - 190px); overflow-y:auto; -webkit-overflow-scrolling:touch;
    position:fixed; right:14px; top:calc(122px + env(safe-area-inset-top)); z-index:34;
    transform:translateX(calc(100% + 40px)); opacity:0; visibility:hidden; pointer-events:none;
    transition:transform .35s ease, opacity .3s ease, visibility 0s linear .35s;
  }
  #legenda.buka {
    transform:none; opacity:1; visibility:visible; pointer-events:auto;
    transition:transform .35s ease, opacity .3s ease;
  }
  body.coarse #legenda {
    position:static; width:min(430px,100%); max-height:calc(100vh - 460px); min-height:120px;
    transform:none; opacity:1; visibility:visible; pointer-events:auto; transition:none;
    flex:0 1 auto;
  }
  @media (orientation:landscape) {
    body.coarse #legenda {
      position:fixed; right:14px; top:calc(122px + env(safe-area-inset-top));
      width:min(330px, 60vw); max-height:calc(100vh - 190px);
      transform:translateX(calc(100% + 40px)); opacity:0; visibility:hidden; pointer-events:none;
      transition:transform .35s ease, opacity .3s ease, visibility 0s linear .35s;
      flex:0 0 auto;
    }
    body.coarse #legenda.buka {
      transform:none; opacity:1; visibility:visible; pointer-events:auto;
      transition:transform .35s ease, opacity .3s ease;
    }
  }
  .leg-kepala { display:flex; flex-direction:column; gap:2px; padding:1px 4px 8px; border-bottom:2px solid #2a3757; }
  .leg-judul { font-family:'Press Start 2P',monospace; font-size:calc(10px * var(--skala)); letter-spacing:2px; color:#ffd166; }
  .leg-sub { font-size:calc(13px * var(--skala)); font-weight:800; color:#aec0e4; }
  .leg-baris {
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:#1a2440; border:2px solid #2a3757; border-radius:11px;
    padding:8px 10px; cursor:pointer; font-family:inherit;
    transition:transform .06s ease;
  }
  .leg-baris:active { transform:translateY(2px); }
  .leg-baris:focus-visible { outline:3px solid #ffd166; outline-offset:2px; }
  .leg-baris.tujuan {
    border-color:#ffd166; background:#21254a;
    box-shadow:0 0 0 1px rgba(255,209,102,.4), 0 0 16px rgba(255,209,102,.16);
  }
  .leg-no {
    flex:0 0 auto; width:36px; height:36px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background:var(--zc,#63c8ff); border-bottom:4px solid var(--zd,#1c6fb4);
    font-family:'Press Start 2P',monospace; font-size:calc(14px * var(--skala));
    color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.4);
  }
  .leg-teks { flex:1 1 auto; display:flex; flex-direction:column; gap:1px; min-width:0; }
  .leg-teks b { font-size:calc(16.5px * var(--skala)); font-weight:900; color:#fff; line-height:1.15; }
  .leg-teks i { font-style:normal; font-size:calc(12.5px * var(--skala)); font-weight:700; color:#9fb2d8; line-height:1.25; }
  .leg-status {
    flex:0 0 auto; font-family:'Press Start 2P',monospace;
    font-size:calc(7.5px * var(--skala)); letter-spacing:1px;
    color:#9fb2d8; background:#2a3757; border-radius:7px; padding:5px 7px 4px;
  }
  .leg-status.buka { color:#0d3a22; background:#5ee89b; }

  /* ---------- petunjuk ---------- */
  .hint {
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom)); z-index:25;
    pointer-events:none; text-align:center;
    font-size:calc(15px * var(--skala)); font-weight:800; color:#eef4ff;
    background:#141d33; border:2px solid #2a3757; border-radius:999px;
    padding:9px 18px; box-shadow:0 4px 0 rgba(0,0,0,.3);
    opacity:0; transition:opacity .6s ease;
    max-width:calc(100vw - 28px);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .hint.tampil { opacity:1; }
  .hint.pudar { opacity:0 !important; }
  body.coarse .hint { bottom:calc(124px + env(safe-area-inset-bottom)); font-size:calc(13.5px * var(--skala)); padding:8px 15px; }

  /* ---------- tombol MASUK besar (mobile, pintu terbuka) ---------- */
  #btnMasukPintu {
    position:fixed; left:50%; bottom:calc(26px + env(safe-area-inset-bottom)); z-index:32;
    transform:translateX(-50%) translateY(14px); opacity:0; pointer-events:none;
    font-family:'Press Start 2P',monospace; font-size:calc(12px * var(--skala));
    color:#3a2a08; background:#ffd166; border:0; border-bottom:6px solid #c9971c;
    border-radius:14px; padding:15px 26px; cursor:pointer; letter-spacing:1px;
    transition:opacity .25s ease, transform .25s ease, border-bottom-width .08s ease;
  }
  #btnMasukPintu.tampil { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  #btnMasukPintu:active { transform:translateX(-50%) translateY(4px); border-bottom-width:2px; }

  /* ---------- kontrol sentuh ---------- */
  #kontrol {
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    display:none; justify-content:space-between; align-items:flex-end;
    padding:0 18px calc(18px + env(safe-area-inset-bottom));
    pointer-events:none;
  }
  body.coarse #kontrol { display:flex; }
  .tb {
    pointer-events:auto;
    width:84px; height:84px;
    font-family:'Press Start 2P',monospace; font-size:24px; line-height:1;
    color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.4);
    background:#1a2440; border:3px solid #37476f; border-radius:18px;
    box-shadow:0 6px 0 #0a0f1c, inset 0 2px 0 rgba(255,255,255,.08);
    cursor:pointer; touch-action:none;
    transition:transform .06s ease, box-shadow .06s ease, background .06s ease;
  }
  .tb.tahan {
    transform:translateY(5px); box-shadow:0 1px 0 #0a0f1c, inset 0 2px 0 rgba(255,255,255,.08);
    background:#28365c; border-color:#4d6196;
  }

  /* ---------- layar muat gerbang (pixel, simetris, anti-terpotong) ---------- */
  .muat {
    position:fixed; inset:0; z-index:60;
    display:flex;                                  /* panel margin:auto: tengah saat muat, bisa digulir saat layar pendek */
    background:rgba(8,12,24,.88);
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:20px 12px;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .4s ease, visibility 0s linear .4s;
  }
  .muat.aktif {
    opacity:1; visibility:visible; pointer-events:auto;
    transition:opacity .4s ease;
  }
  .muat-aura {
    position:fixed; inset:0; pointer-events:none;   /* fixed: tak ikut menggulung */
    background:radial-gradient(circle at 50% 42%, var(--aura, rgba(99,200,255,.16)), rgba(8,12,24,0) 60%);
  }
  .muat-isi {
    position:relative; text-align:center; width:min(372px, 94vw); margin:auto;
    background:#141d33; border:4px solid #2a3757; border-radius:14px;
    box-shadow:0 10px 0 rgba(0,0,0,.4);
    padding:22px 20px;
  }
  .muat-lompat { position:relative; width:54px; height:72px; margin:0 auto 16px; }
  .muat-bola {
    position:absolute; left:0; right:0; bottom:12px; height:54px; border-radius:50%;
    background:radial-gradient(circle at 34% 28%, #fff3cf, #f6c453 58%, #d98f2b);
    box-shadow:0 0 26px rgba(255,214,120,.45), inset 0 -5px 0 rgba(0,0,0,.14);
    transform-origin:50% 100%;
    animation:muatNaik 1.1s cubic-bezier(.5,.02,.6,1) infinite;
  }
  .muat-bayangan {
    position:absolute; left:7px; right:7px; bottom:0; height:8px; border-radius:4px;
    background:rgba(0,0,0,.4);
    animation:muatBayangan 1.1s cubic-bezier(.5,.02,.6,1) infinite;
  }
  @keyframes muatNaik {
    0%   { transform:translateY(0)     scale(1.14,.80); }
    16%  { transform:translateY(-8px)  scale(.94,1.09); }
    46%  { transform:translateY(-26px) scale(1,1); }
    82%  { transform:translateY(-2px)  scale(.96,1.07); }
    93%  { transform:translateY(0)     scale(1.16,.78); }
    100% { transform:translateY(0)     scale(1.14,.80); }
  }
  @keyframes muatBayangan {
    0%,100% { transform:scaleX(1.08); opacity:.36; }
    46%     { transform:scaleX(.62);  opacity:.15; }
  }
  .muat-judul {
    font-family:'Press Start 2P',monospace;
    font-size:calc(clamp(13px, 3.4vw, 17px) * var(--skala));
    line-height:1.7; letter-spacing:.5px;
    color:#ffd166; max-width:78vw; margin:0 auto;
  }
  .muat-sub { margin-top:9px; font-size:calc(15px * var(--skala)); font-weight:800; color:#aec0e4; }
  .muat-titik { margin-left:2px; }
  .muat-titik span { display:inline-block; animation:muatKedip 1.2s infinite; }
  .muat-titik span:nth-child(2) { animation-delay:.2s; }
  .muat-titik span:nth-child(3) { animation-delay:.4s; }
  @keyframes muatKedip { 0%,60%,100% { opacity:.25; } 30% { opacity:1; } }
  .muat-iklan {
    margin:16px auto 0; width:min(324px, 100%);   /* pas mengikuti panel: bingkai simetris di semua layar */
    background:rgba(255,255,255,.05);
    border:2px solid #2a3757; border-radius:10px; padding:10px;
  }
  .muat-slot { min-height:250px; }
  .muat-slot:not(:empty) { min-height:0; }
  .muat-slot .ad-slot { margin:0 auto !important; }   /* rapikan margin injeksi iklan agar benar-benar di tengah */
  .muat-slot iframe { background:#18213a !important; } /* sebelum kreatif iklan termuat: biru tua rapi, bukan dunia tembus pandang */
  .muat-garis {
    margin:14px auto 0; width:min(324px, 100%); height:6px; border-radius:3px;
    background:#0e1526; overflow:hidden;
  }
  .muat-garis span {
    display:block; height:100%; width:40%;
    background:linear-gradient(90deg, rgba(255,209,102,0), #ffd166, rgba(255,209,102,0));
    animation:muatGaris 1.4s ease-in-out infinite;
  }
  @keyframes muatGaris { from { transform:translateX(-110%); } to { transform:translateX(300%); } }
  .muat-batal {
    display:block; margin:16px auto 0;              /* di dalam panel, tengah bawah: komposisi simetris */
    font-family:'Press Start 2P',monospace; font-size:calc(12px * var(--skala));
    color:#e3ebfa; background:#1a2440; border:3px solid #37476f; border-bottom-width:5px;
    border-radius:10px; padding:13px 24px; cursor:pointer; box-shadow:0 4px 0 #0a0f1c;
  }
  .muat-batal:active { transform:translateY(3px); border-bottom-width:2px; box-shadow:0 1px 0 #0a0f1c; }
  /* layar pendek: padatkan tanpa memotong iklan — overlay tetap bisa digulir */
  @media (max-height:680px) {
    .muat { padding:12px 10px; }
    .muat-isi { padding:16px 16px 14px; }
    .muat-lompat { width:44px; height:58px; margin-bottom:10px; }
    .muat-bola { height:42px; bottom:12px; }
    .muat-bayangan { left:9px; right:9px; }
    .muat-judul { font-size:calc(clamp(11px, 3vw, 14px) * var(--skala)); }
    .muat-iklan { margin-top:12px; }
    .muat-batal { margin-top:12px; padding:11px 20px; }
  }
  @media (max-height:560px) {
    .muat-lompat { display:none; }
  }
  @media (prefers-reduced-motion:reduce) {
    .muat-bola, .muat-bayangan, .muat-titik span, .muat-garis span { animation:none; }
  }

  /* ---------- intro pixel ---------- */
  .intro {
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center;
    text-align:center; padding:18px;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:#0d1424;
    background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.4px);
    background-size:24px 24px;
    transition:opacity .55s ease;
  }
  .intro.pergi { opacity:0; pointer-events:none; }
  .intro .panel {
    margin:auto;   /* tengah aman saat panel lebih tinggi dari layar */
    background:#141d33; border:4px solid #2a3757; border-radius:16px;
    box-shadow:0 12px 0 rgba(0,0,0,.4);
    padding:34px 26px 30px; width:min(520px,100%);
  }
  @media (max-height:520px) {
    .intro .panel { padding:20px 20px 22px; box-shadow:0 8px 0 rgba(0,0,0,.4); }
    .intro .akio-css { width:38px; height:38px; margin-bottom:12px; }
    .intro h1 { line-height:1.4; }
    .intro .ramah { display:none; }
    .intro button { margin-top:16px; padding:13px 28px; }
  }
  /* bulatan emas murni — TANPA wajah (syariah) */
  .intro .akio-css {
    width:52px; height:52px; margin:0 auto 20px; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #ffe9ad, #f6c453 62%, #d98f2b);
    box-shadow:inset 0 -6px 0 rgba(0,0,0,.14), 0 6px 0 rgba(0,0,0,.3);
    animation:melayang 2.6s ease-in-out infinite;
  }
  @keyframes melayang { 0%,100% { transform:translateY(0) scale(1,1); } 50% { transform:translateY(-10px) scale(.97,1.04); } }
  .intro h1 {
    font-family:'Press Start 2P',monospace;
    font-size:calc(clamp(17px, 5vw, 26px) * var(--skala));
    line-height:1.6; letter-spacing:1px;
    color:#ffd166;
  }
  .intro .bawah { margin-top:14px; font-size:calc(17px * var(--skala)); font-weight:800; color:#e8eef8; }
  .intro .catatan { margin-top:6px; font-size:calc(14px * var(--skala)); font-weight:700; color:#aec0e4; line-height:1.5; }
  .intro .ramah {
    margin-top:12px; font-size:calc(13px * var(--skala)); font-weight:800; color:#7dffa8;
    background:rgba(93,232,155,.08); border:2px solid rgba(93,232,155,.25);
    border-radius:10px; padding:8px 10px; line-height:1.45;
  }
  .intro button {
    margin-top:24px; font-family:'Press Start 2P',monospace;
    font-size:calc(13px * var(--skala));
    color:#3a2a08; background:#ffd166; border:0; border-radius:12px;
    border-bottom:6px solid #c9971c;
    padding:17px 36px; cursor:pointer; letter-spacing:1px;
    transition:transform .08s ease, border-bottom-width .08s ease;
  }
  .intro button:active { transform:translateY(4px); border-bottom-width:2px; }
  @media (prefers-reduced-motion:reduce) {
    .intro .akio-css { animation:none; }
  }
</style>
</head>
<body>

<div id="panggung">
  <canvas id="layar" width="480" height="270" aria-label="Dunia Akiomida, peta pixel dengan enam wilayah matematika dalam satu layar"></canvas>
  <div id="legenda" aria-label="Daftar wilayah Perpustakaan Matematika"></div>
</div>

<div class="chip-wilayah" id="chipWilayah" aria-live="polite">
  <span class="kecil">WILAYAH</span>
  <span class="nama" id="chipNama">Dunia Akiomida</span>
  <span class="slogan" id="chipSlogan">Gerakkan Akio ke pintu tujuan</span>
</div>

<div id="akses" aria-label="Pengaturan ukuran tulisan">
  <button id="btnMin" type="button" aria-label="Perkecil tulisan">A&minus;</button>
  <button id="btnPlus" type="button" aria-label="Perbesar tulisan">A+</button>
</div>

<button id="btnLegenda" type="button" aria-label="Buka daftar wilayah">&#9776; WILAYAH</button>

<div class="hint tampil" id="hint">Gerakkan Akio ke pintu wilayah</div>

<button id="btnMasukPintu" type="button">MASUK</button>

<div id="kontrol">
  <button class="tb" id="btnKiri" type="button" aria-label="Jalan ke kiri">&#9664;</button>
  <button class="tb" id="btnKanan" type="button" aria-label="Jalan ke kanan">&#9654;</button>
</div>

<div class="muat" id="muat" role="dialog" aria-hidden="true" aria-label="Memuat Dunia">
  <div class="muat-aura" id="muatAura"></div>
  <div class="muat-isi">
    <div class="muat-lompat" aria-hidden="true">
      <span class="muat-bola"></span>
      <span class="muat-bayangan"></span>
    </div>
    <div class="muat-judul" id="muatJudul">Membuka wilayah</div>
